name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare CRM Mac Messages helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crm.html')
          s = p.read_text()
          tag = '<script src="crm-mac-sms.js?v=${{ github.sha }}"></script>'
          if 'crm-mac-sms.js' not in s:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
