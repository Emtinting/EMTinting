<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EM Tinting Payment</title><style>body{font-family:system-ui;background:#101114;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:440px;padding:32px;border:1px solid #393939;border-radius:18px;text-align:center}a{color:#f34c4c}</style></head><body><main><h1>EM Tinting</h1><h2 id="title">Payment status</h2><p id="message">Check your Stripe receipt for payment confirmation.</p><p><a href="https://emtinting.com">Return to EM Tinting</a></p></main><script>const cancelled=new URLSearchParams(location.search).get("status")==="cancel";document.getElementById("title").textContent=cancelled?"Payment not completed":"Thank you";document.getElementById("message").textContent=cancelled?"Your checkout was cancelled. No payment was completed through this session.":"Stripe is processing your payment. Your invoice status will update once payment is confirmed. Check your Stripe receipt for confirmation.";</script></body></html>
